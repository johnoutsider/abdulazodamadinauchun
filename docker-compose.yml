services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: politeness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: politeness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politeness"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Jadval va boshlang'ich ma'lumotlarni yaratadi (takror ishlatish xavfsiz)
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://politeness:${POSTGRES_PASSWORD}@db:5432/politeness
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_SAMPLES: ${SEED_SAMPLES:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://politeness:${POSTGRES_PASSWORD}@db:5432/politeness
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET kerak}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
